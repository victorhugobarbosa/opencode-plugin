services:
  opencode-gateway:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-google/gemini-2.0-flash-exp:free}"
    volumes:
      # persiste estado do opencode entre restarts
      - opencode_state:/root/.local/state/opencode
    restart: unless-stopped

volumes:
  opencode_state:
